[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dnf-ocr-synth"
version = "0.1.1"
description = "Local-font DNF nickname samples for OCR training"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=12.3,<13", "fonttools>=4.60,<5"]

[project.optional-dependencies]
dev = ["ruff>=0.13,<1", "build>=1.3,<2"]

[project.scripts]
dnf-ocr-synth = "dnf_ocr_synth.__main__:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D"]
ignore = ["D105"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
